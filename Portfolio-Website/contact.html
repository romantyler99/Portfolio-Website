<section class="contact-section">
    <h1>Contact Me</h1>
    <p>If you have any questions or just want to say hello, feel free to reach out!</p>
    <p>You can also find me on <a href="https://www.linkedin.com/in/tyler-roman-742350255/" target="_blank" rel="noopener noreferrer">LinkedIn</a>.</p>
    <form class="contact-form" action="https://formspree.io/f/mrbleobj" method="POST">
    <div class="form-group">
      <label for="full-name">Full Name</label>
      <input type="text" id="full-name" name="full-name" required>
    </div>
    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div class="form-group">
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required></textarea>
      </div>

  <!-- This tells Formspree where to redirect after successful submission -->
    <input type="hidden" name="_redirect" value="thankyou.html">

    <button type="submit" class="contact-submit">Send Message</button>
</form>

</section>
<div class="custom-cursor"></div>
